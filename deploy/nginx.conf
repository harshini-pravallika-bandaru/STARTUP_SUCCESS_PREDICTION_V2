server {
    listen 80;
    server_name _;   # replace with your domain or public IP

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static {
        alias /home/ubuntu/startup_platform/static;
    }
}
