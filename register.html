{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Register</h2>
        <form method="post">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contact Info</label>
                <input type="text" name="contact_info" class="form-control">
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Role</label>
                <select name="role" id="role" class="form-select" onchange="toggleInvestorName()">
                    <option value="startup">Startup</option>
                    <option value="investor">Investor</option>
                </select>
            </div>
            <div class="mb-3" id="investorNameDiv" style="display: none;">
                <label>Investor Name</label>
                <input type="text" name="investor_name" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <a href="{{ url_for('login') }}" class="btn btn-link">Back to Login</a>
        </form>
    </div>
</div>
<script>
function toggleInvestorName() {
    var role = document.getElementById('role').value;
    var div = document.getElementById('investorNameDiv');
    div.style.display = (role === 'investor') ? 'block' : 'none';
}
</script>
{% endblock %}
